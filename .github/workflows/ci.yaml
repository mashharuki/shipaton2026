name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    name: Typecheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # expo-env.d.ts is generated by the Expo CLI on first run and is gitignored;
      # materialize it here so `tsc` sees the ambient expo/types it references.
      - name: Generate Expo environment types
        if: matrix.workspace == 'frontend'
        working-directory: apps/frontend
        run: |
          printf '/// <reference types="expo/types" />\n\n// NOTE: This file should not be edited and should be in your git ignore' > expo-env.d.ts
      - name: Generate Cloudflare Worker types
        if: matrix.workspace == 'backend'
        run: pnpm --filter backend cf-typegen
      - run: pnpm --filter ${{ matrix.workspace }} run typecheck

  test:
    name: Vitest (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --if-present skips workspaces that don't declare a "test" script yet
      # (backend/frontend), so this job auto-covers them once later tasks add one.
      - run: pnpm --filter ${{ matrix.workspace }} --if-present run test

  e2e:
    name: Playwright E2E (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Configure matching API_SHARED_KEY for backend and frontend
        run: |
          echo "API_SHARED_KEY=${E2E_API_SHARED_KEY}" >> apps/backend/.dev.vars
          echo "EXPO_PUBLIC_API_SHARED_KEY=${E2E_API_SHARED_KEY}" >> apps/frontend/.env.local
      - name: Apply local D1 migrations
        working-directory: apps/backend
        run: pnpm run db:migrate:local
      - name: Run E2E smoke tests
        working-directory: apps/frontend
        run: pnpm run e2e
